<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>ESP32 Sensor Info</title>
	<link rel="stylesheet" href="/index.css">
</head>
<body>
	<h2>ESP32 Sensor Info</h2>
	<button id="fetchBtn">Get Sensor Data</button>
	<button id="pairingBtn">Add New Node</button>
	<button id="nodesBtn">Show Connected Nodes</button>
	<div id="sensorData">Sensor data will appear here.</div>
	<div id="nodesData">Connected nodes will appear here.</div>
	<label for="manualSwitch">Manual mode</label>
	<input type="checkbox" id="manualSwitch">
	<br>
	<button id="manualBtn" disabled>Turn ON the valve</button>
	<button id="manualOffBtn" disabled>Turn OFF the valve</button>
	<br>
	<script>
		function formatValue(value, digits = 2) {
			return Number.isFinite(value) ? value.toFixed(digits) : 'n/a';
		}

		document.getElementById('fetchBtn').onclick = async function() {
			const sensorDataDiv = document.getElementById('sensorData');
			sensorDataDiv.textContent = 'Loading...';
			try {
				const response = await fetch('/api/nodes');
				if (!response.ok) throw new Error('Network response was not ok');
				const data = await response.json();
				const summary = data.summary || {};

				if (!Number.isFinite(summary.online_count) || summary.online_count === 0) {
					sensorDataDiv.textContent = 'No online nodes yet.';
					return;
				}
				sensorDataDiv.innerHTML = `
					<strong>Average Soil Moisture:</strong> ${formatValue(Number(summary.soil_avg)*100)} %<br>
					<strong>Average Outside Temperature:</strong> ${formatValue(Number(summary.temp_avg))} °C<br>
					<strong>Average Light Intensity:</strong> ${formatValue(Number(summary.light_avg)*100)} %<br>
					<strong>Online Nodes:</strong> ${summary.online_count}
				`;
			} catch (err) {
				sensorDataDiv.textContent = 'Error fetching sensor data: ' + err;
			}
		};

		document.getElementById('pairingBtn').onclick = async function() {
			try {
				const response = await fetch('/api/pairing/start', { method: 'POST' });
				if (!response.ok) throw new Error('Network response was not ok');
				alert('Pairing mode enabled. Now add the new node.');
			} catch (err) {
				alert('Greška pri uključivanju pairing moda: ' + err);
			}
		};

		document.getElementById('nodesBtn').onclick = async function() {
			const nodesDiv = document.getElementById('nodesData');
			nodesDiv.textContent = 'Loading nodes...';
			try {
				const response = await fetch('/api/nodes');
				if (!response.ok) throw new Error('Network response was not ok');
				const data = await response.json();
				if (!data.nodes || data.nodes.length === 0) {
					nodesDiv.textContent = 'No connected nodes yet.';
					return;
				}

				let html = '<strong>Connected Nodes:</strong><br>';
				for (const node of data.nodes) {
					html += `
						<div style="margin-bottom: 12px;">
							<strong>Node ${node.node_id}</strong> - ${node.online ? 'online' : 'offline'}<br>
							MAC: ${node.mac}<br>
							Channel: ${node.channel}<br>
							Network ID: ${node.network_id}<br>
							${node.online ? `Soil: ${formatValue(Number(node.soil)*100)} %, Light: ${formatValue(Number(node.light))*100} %, Temp: ${formatValue(Number(node.temp))} °C<br>` : ''}
						</div>
						<br>
					`;
				}
				nodesDiv.innerHTML = html;
			} catch (err) {
				nodesDiv.textContent = 'Error fetching nodes: ' + err;
			}
		};
	//logika za manual switch
	const manualSwitch = document.getElementById('manualSwitch');
	const manualBtn = document.getElementById('manualBtn');
	const manualOffBtn = document.getElementById('manualOffBtn');
	   manualSwitch.addEventListener('change', async function() {
		   if (manualSwitch.checked) {
			   manualBtn.disabled = false;
			   manualOffBtn.disabled = false;
			   try {
				const response = await fetch('/api/manualMode/on', {method: 'POST'});
				if (!response.ok) throw new Error('Network response was not ok');
			   } catch (err){
				alert('Greška pri uključivanju ventila: ' + err)
			   }
		   } else {
			   manualBtn.disabled = true;
			   manualOffBtn.disabled = true;
			   try {
				const response = await fetch('/api/manualMode/off', {method: 'POST'});
				if (!response.ok) throw new Error('Network response was not ok');
			   } catch (err){
				alert('Greška pri uključivanju ventila: ' + err)
			   }
		   }
	   });

	   manualBtn.addEventListener('click', async function() {
		   //serveru za ručno uključivanje ventila
		   try {
			   const response = await fetch('/api/ventil/on', { method: 'POST' });
			   if (!response.ok) throw new Error('Network response was not ok');
			   alert('Ventil uključen!');
		   } catch (err) {
			   alert('Greška pri uključivanju ventila: ' + err);
		   }
	   });

	   manualOffBtn.addEventListener('click', async function() {
		   //zahtjev serveru za ručno isključivanje ventila
		   try {
			   const response = await fetch('/api/ventil/off', { method: 'POST' });
			   if (!response.ok) throw new Error('Network response was not ok');
			   alert('Ventil isključen!');
		   } catch (err) {
			   alert('Greška pri isključivanju ventila: ' + err);
		   }
	   });
	</script>
</body>
</html>
